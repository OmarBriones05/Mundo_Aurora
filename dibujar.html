<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dibujar - Mundo Aurora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Trebuchet MS', sans-serif;
    background:#87ceeb;
}

header{
    background:linear-gradient(
        120deg,
        #00ff88 0%,
        #00ffd5 25%,
        #4da6ff 50%,
        #8a5cff 75%,
        #ff66cc 100%
    );
    color:white;
    text-align:center;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.logo{
    width:120px;
    display:block;
    margin:auto;
}

header h1{
    margin:0;
    font-size:2.5em;
    font-family:'Fredoka', sans-serif;
    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 20px rgba(255,255,255,0.5);
}

nav{
    background:#fff0a8;
    text-align:center;
    padding:15px;
}

nav a{
    color:#444;
    text-decoration:none;
    margin:15px;
    font-size:18px;
    font-weight:bold;
}

nav a:hover{
    color:#ff1493;
}

.hero{
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    color:white;
    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 20px rgba(255,255,255,.6);
}

.paint-container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.toolbar{
    background:white;
    border-radius:25px;
    padding:20px;
    margin-bottom:20px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    box-shadow:0 6px 15px rgba(0,0,0,.15);
}

.toolbar button,
.toolbar input{
    border:none;
    border-radius:20px;
}

.tool-btn{
    background:#ff69b4;
    color:white;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
}

.tool-btn:hover{
    background:#ff1493;
}

#color{
    width:60px;
    height:45px;
    cursor:pointer;
}

canvas{
    display:block;
    margin:auto;
    background:white;
    border-radius:20px;
    border:4px solid white;
    box-shadow:0 6px 15px rgba(0,0,0,.15);
    touch-action:none;
    max-width:100%;
}

footer{
    background:#6a5acd;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:40px;
}

</style>
</head>

<body>

<header>
    <img src="Logo.png" alt="Logo Mundo Aurora" class="logo">
    <h1>Mundo Aurora</h1>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="personajes.html">Personajes</a>
    <a href="galeria.html">Galería</a>
    <a href="cuentos.html">Cuentos</a>
    <a href="juegos.html">Juegos</a>
</nav>

<section class="hero">
    <h1>Taller de Dibujo Mágico</h1>
    <p>¡Crea tus propios dibujos!</p>
</section>

<div class="paint-container">

    <div class="toolbar">

        <button class="tool-btn" id="brushBtn">Pincel</button>

        <button class="tool-btn" id="eraserBtn">Borrador</button>

        <label>

            <input type="color" id="color" value="#000000">
        </label>

        <label>
            Tamaño
            <input type="range" id="size" min="1" max="50" value="5">
        </label>

        <button class="tool-btn" id="undoBtn">Deshacer</button>

        <button class="tool-btn" id="clearBtn">Limpiar</button>

        <button class="tool-btn" id="saveBtn">Descargar</button>

    </div>

    <canvas id="canvas" width="1000" height="600"></canvas>

</div>

<footer>
⭐ Hecho con amor para niños y familias ⭐
</footer>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function fillWhiteBackground(){
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

fillWhiteBackground();

const colorPicker = document.getElementById("color");
const sizePicker = document.getElementById("size");

let drawing = false;
let erasing = false;

let history = [];

function saveState(){
    history.push(canvas.toDataURL());

    if(history.length > 30){
        history.shift();
    }
}

fillWhiteBackground();
saveState();

function startDrawing(e){

    drawing = true;

    saveState();

    draw(e);
}

function stopDrawing(){
    drawing = false;
    ctx.beginPath();
}

function getPosition(e){

    const rect = canvas.getBoundingClientRect();

    let x,y;

    if(e.touches){
        x = e.touches[0].clientX - rect.left;
        y = e.touches[0].clientY - rect.top;
    }else{
        x = e.clientX - rect.left;
        y = e.clientY - rect.top;
    }

    return {x,y};
}

function draw(e){

    if(!drawing) return;

    const pos = getPosition(e);

    ctx.lineWidth = sizePicker.value;
    ctx.lineCap = "round";

    if(erasing){
        ctx.strokeStyle = "#ffffff";
    }else{
        ctx.strokeStyle = colorPicker.value;
    }

    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(pos.x,pos.y);
}

canvas.addEventListener("mousedown",startDrawing);
canvas.addEventListener("mouseup",stopDrawing);
canvas.addEventListener("mousemove",draw);

canvas.addEventListener("touchstart",startDrawing);
canvas.addEventListener("touchend",stopDrawing);
canvas.addEventListener("touchmove",draw);

document.getElementById("brushBtn").onclick = ()=>{
    erasing = false;
};

document.getElementById("eraserBtn").onclick = ()=>{
    erasing = true;
};

document.getElementById("clearBtn").onclick = ()=>{

    saveState();

    ctx.clearRect(0,0,canvas.width,canvas.height);

    fillWhiteBackground();
};

document.getElementById("undoBtn").onclick = ()=>{

    if(history.length < 2) return;

    history.pop();

    const img = new Image();

    img.src = history[history.length-1];

    img.onload = ()=>{

        ctx.clearRect(0,0,canvas.width,canvas.height);

        ctx.drawImage(img,0,0);
    };
};

document.getElementById("saveBtn").onclick = ()=>{

    const link = document.createElement("a");

    link.download = "Mi_Dibujo.png";

    link.href = canvas.toDataURL("image/png");

    link.click();
};

</script>

</body>
</html>
