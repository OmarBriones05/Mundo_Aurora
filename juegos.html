<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juegos - Mundo Aurora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Trebuchet MS', sans-serif;
    background:#87ceeb;
}

header{
    background:linear-gradient(
        120deg,
        #00ff88 0%,
        #00ffd5 25%,
        #4da6ff 50%,
        #8a5cff 75%,
        #ff66cc 100%
    );
    color:white;
    text-align:center;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.logo{
    width:120px;
    height:auto;
    display:block;
    margin:0 auto 10px auto;
}

header h1{
    margin:0;
    font-size:2.5em;
    font-family:'Fredoka', sans-serif;
    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 20px rgba(255,255,255,0.5);
}

nav{
    background:#fff0a8;
    text-align:center;
    padding:15px;
}

nav a{
    color:#444;
    text-decoration:none;
    margin:15px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    color:#ff1493;
}

.hero{
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:3.2em;
    color:#ffffff;
    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 20px rgba(255,255,255,0.6),
        0 0 30px rgba(255,255,255,0.4);
}

.games{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    padding:30px;
}

.game-card{
    background:white;
    width:280px;
    padding:25px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 6px 15px rgba(0,0,0,.15);
    transition:.3s;
}

.game-card:hover{
    transform:translateY(-8px);
}

.game-card h2{
    color:#000000;
}

.play-btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 25px;
    background:#ff69b4;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.play-btn:hover{
    background:#ff1493;
}

footer{
    background:#6a5acd;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:40px;
}

</style>
</head>

<body>

<header>
    <img src="Logo.png" alt="Logo Mundo Aurora" class="logo">
    <h1>Mundo Aurora</h1>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="personajes.html">Personajes</a>
    <a href="galeria.html">Galería</a>
    <a href="cuentos.html">Cuentos</a>
    <a href="juegos.html">Juegos</a>
</nav>

<section class="hero">
    <h1>Juegos Mágicos</h1>
    <p>¡Diviértete con tus amigos!</p>
</section>

<section class="games">

    <div class="game-card">
        <h2>Rompecabezas</h2>
        <p>Arma imágenes mágicas del Mundo Aurora.</p>
        <a href="rompecabezas.html" class="play-btn">Jugar</a>
    </div>

    <div class="game-card">
        <h2>Memoria</h2>
        <p>Encuentra las parejas de personajes.</p>
        <a href="memoria.html" class="play-btn">Jugar</a>
    </div>

    <div class="game-card">
        <h2>Dibujar</h2>
        <p>Crea tus propios dibujos.</p>
        <a href="dibujar.html" class="play-btn">Jugar</a>
    </div>

</section>

<footer>
⭐ Hecho con amor para niños y familias ⭐
</footer>

</body>
</html>
